services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-cahayabaru-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_SSLMODE: require
      LOG_CHANNEL: stderr
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    networks:
      - inventory
    volumes:
      - ./:/var/www/html:rw

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-cahayabaru-queue
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work --tries=3 --timeout=90
    depends_on:
      - app
    networks:
      - inventory
    volumes:
      - ./:/var/www/html:rw

  web:
    image: nginx:1.27-alpine
    container_name: inventory-cahayabaru-web
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.inventory-cahayabaru.rule=Host(`localhost`)
      - traefik.http.routers.inventory-cahayabaru.entrypoints=web
      - traefik.http.services.inventory-cahayabaru.loadbalancer.server.port=80
    networks:
      - traefik
      - inventory

  traefik:
    image: traefik:v3.1
    container_name: inventory-cahayabaru-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --api.insecure=true
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik

networks:
  inventory:
  traefik:
    name: traefik
